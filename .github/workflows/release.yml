name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+-*'
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing git tag to build and release (e.g. 1.0.0)'
        required: true
        default: '1.0.0'

permissions:
  contents: write

jobs:
  release:
    name: Build & publish release
    runs-on: windows-latest

    steps:
      # Tag pushes check out the pushed tag automatically; manual runs check out
      # the tag named in the input so we can release an already-existing tag.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}
          fetch-depth: 0

      - name: Resolve version
        id: ver
        shell: pwsh
        env:
          RELEASE_INPUT_TAG: ${{ github.event.inputs.tag }}
          RELEASE_REF_TAG: ${{ github.ref_name }}
        run: |
          $tag = "$env:RELEASE_INPUT_TAG".Trim()
          if ($tag -eq '') { $tag = "$env:RELEASE_REF_TAG" }
          $version = $tag -replace '^v', ''
          if ($version -notmatch '^\d+\.\d+\.\d+(?:-[0-9A-Za-z]+(?:[.-][0-9A-Za-z]+)*)?(?:\+[0-9A-Za-z]+(?:[.-][0-9A-Za-z]+)*)?$') { throw 'Invalid release tag.' }
          Write-Host "Tag: $tag  ->  Version: $version"
          "tag=$tag"         | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "prerelease=$($version -match '^\d+\.\d+\.\d+-')" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.3xx

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Build, test and package
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.ver.outputs.version }}
        run: scripts/build.ps1 -Version $env:RELEASE_VERSION -OutputPath publish

      - name: Sign release metadata
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.ver.outputs.version }}
          GSYNC_SIGNING_KEY_PKCS8_BASE64: ${{ secrets.GSYNC_SIGNING_KEY_PKCS8_BASE64 }}
        run: |
          dotnet run --project src/GSYNC.ReleaseSigner/GSYNC.ReleaseSigner.csproj --configuration Release -- "publish/GSYNC-$env:RELEASE_VERSION-win-x64.zip" "$env:RELEASE_VERSION"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: GSYNC ${{ steps.ver.outputs.version }}
          tag_name: ${{ steps.ver.outputs.tag }}
          generate_release_notes: true
          prerelease: ${{ steps.ver.outputs.prerelease }}
          files: |
            publish/GSYNC-${{ steps.ver.outputs.version }}-win-x64.zip
            publish/GSYNC-${{ steps.ver.outputs.version }}-win-x64.manifest.json
            publish/GSYNC-${{ steps.ver.outputs.version }}-win-x64.manifest.sig
